<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
</head>
<body>
    <img src="images/icon-128.png" width="128" height="128" alt="FeedBlocker Icon">
        
    <h2>Feed Blocker</h2>
    
    <div class="subheader">
        Block the insidious feeds and free yourself from toxic algorithms without losing access to your socials.
    </div>
    
    <div class="row">
        <label for="facebook">Block Facebook</label>
        <input type="checkbox" id="facebook">
    </div>
    
    <div class="row">
        <label for="instagram">Block Instagram</label>
        <input type="checkbox" id="instagram">
    </div>
    
    <div class="row">
        <label for="youtube">Block YouTube</label>
        <input type="checkbox" id="youtube">
    </div>
    
    <div class="footer">
        This extension is free and open for everyone.
    </div>
</body>
</html>
